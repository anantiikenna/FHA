name: CI

# develop → master gated flow (AGENTS.md §36 Step 7).
#   push to develop  → Lint/build/test + Security + E2E gates
#     GREEN → promote job fast-forwards develop → master,
#             and fires the Netlify deploy hook (gates already passed)
#     RED   → change stays on develop; master untouched
#   push to master   → same gates re-run (human pushes); deploy hook fires
#             only after they pass

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, build & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Match Netlify (netlify.toml → NODE_VERSION = "20")
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # Public client values (not secrets — they ship in every browser
          # bundle). Repo secrets override; demo fallbacks = root .env.example.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://cqhgptnsmmmobnfnpvao.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_DtoL9caBhLzGxc4zbboY7Q_RV3iaLLm' }}
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_APP_ENV: ci
          NEXT_PUBLIC_MAP_STYLE_URL: /map-style.json

      - name: Test
        run: npm run test

  # Playwright E2E against the production build + live demo database.
  # Covers map markings/rendering (worker, tiles, glyph labels), the
  # draw→name→save flow, ?area= deep links, and UI↔API data parity on
  # dashboard/properties/map counts (AGENTS.md §25 E2E, §36 Step 6).
  e2e:
    name: E2E (map & core flows)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # System Chrome is preinstalled on ubuntu-latest (channel: "chrome").
      # Job logs require auth to download, so on failure the failing test
      # headers (spec:line + title) are surfaced as check annotations, which
      # are readable without auth (AGENTS.md §36 Step 7).
      - name: Playwright E2E
        shell: bash
        run: |
          set +e
          npx playwright test 2>&1 | tee e2e-run.log
          code=$?
          if [ "$code" -ne 0 ]; then
            # Error details first (annotations are capped per step), then headers.
            start=$(grep -n -m1 -E '^[[:space:]]*[0-9]+\)' e2e-run.log | cut -d: -f1)
            if [ -n "$start" ]; then
              tail -n +"$start" e2e-run.log \
                | grep -E 'Test timeout|Error:|TimeoutError|strict mode violation|Expected|Received' \
                | sed 's/^[[:space:]]*//' | head -7 > failed-detail.txt
              while IFS= read -r line; do
                echo "::error title=E2E failure detail::$line"
              done < failed-detail.txt
              grep -E '^[[:space:]]*[0-9]+\)' e2e-run.log | sed 's/^[[:space:]]*//' | head -3 > failed-tests.txt
              while IFS= read -r line; do
                echo "::error title=E2E failing test::$line"
              done < failed-tests.txt
            fi
            echo "--- last 120 lines of playwright output ---"
            tail -n 120 e2e-run.log
          fi
          exit "$code"
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://cqhgptnsmmmobnfnpvao.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_DtoL9caBhLzGxc4zbboY7Q_RV3iaLLm' }}
          NEXT_PUBLIC_APP_URL: http://localhost:3100
          NEXT_PUBLIC_APP_ENV: e2e
          NEXT_PUBLIC_MAP_STYLE_URL: /map-style.json

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7

  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Dependency audit vs committed baseline — NEW advisories fail the gate.
      # Shrink the baseline after fixes: node .github/scripts/security-gate.mjs --update
      - name: Dependency audit (baseline gate)
        run: node .github/scripts/security-gate.mjs

      # Fail if a real .env file or an obvious credential pattern is tracked.
      - name: Committed-secret scan
        shell: bash
        run: |
          set -euo pipefail
          bad=$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '\.env\.example$' || true)
          if [ -n "$bad" ]; then
            echo "::error::Tracked environment file(s) found: $bad"
            exit 1
          fi
          if git grep -nI -E 'sb_secret_[A-Za-z0-9_-]{8,}|-----BEGIN [A-Z ]*PRIVATE KEY-----' -- ':!.github' ':!*.md' ':!*.example'; then
            echo "::error::Possible committed secret found (matches above)."
            exit 1
          fi
          echo "Secret-leak scan OK."

  promote:
    name: Promote develop to master
    needs: [checks, security, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
    steps:
      # Full history so the fast-forward push to master has the commits it needs.
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      # Green on develop → fast-forward master to develop's commit. Simple and
      # atomic (no PR round-trip). A token push does NOT trigger the deploy
      # workflow (GitHub blocks token-triggered loops), so this job fires the
      # Netlify hook itself after checks+security+e2e passed (that is the gate).
      - name: Promote develop → master (fast-forward)
        id: promote
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/master)" ]; then
            echo "develop already matches master — nothing to promote."
            echo "promoted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Fast-forward master to develop (fails if master diverged — safe).
          git push origin develop:master
          echo "Fast-forwarded master to develop."
          echo "promoted=true" >> "$GITHUB_OUTPUT"

      # GITHUB_TOKEN pushes do not trigger further workflow runs, so this job
      # fires the deploy hook itself — only after needs: [checks, security, e2e]
      # passed (that is the gate).
      - name: Trigger gated deploy
        if: steps.promote.outputs.promoted == 'true' && env.NETLIFY_BUILD_HOOK != ''
        run: curl -sS -X POST --fail-with-body "$NETLIFY_BUILD_HOOK"

      - name: Deploy note (hook not configured yet)
        if: steps.promote.outputs.promoted == 'true' && env.NETLIFY_BUILD_HOOK == ''
        run: |
          echo "::notice::Promoted develop → master. NETLIFY_BUILD_HOOK unset — Netlify's own integration deploys. Set the hook + disable Netlify auto-deploy for fully gated deploys (AGENTS.md 36 Step 7)."

  deploy:
    name: Deploy to Netlify
    needs: [checks, security, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
    steps:
      - name: Trigger Netlify build (gated — checks already passed)
        if: env.NETLIFY_BUILD_HOOK != ''
        run: curl -sS -X POST --fail-with-body "$NETLIFY_BUILD_HOOK"

      - name: Skip notice (hook not configured yet)
        if: env.NETLIFY_BUILD_HOOK == ''
        run: |
          echo "::notice::NETLIFY_BUILD_HOOK secret is not set - deploy trigger skipped."
          echo "Checks still gate every push/PR. To gate master deploys:"
          echo "1) Netlify -> Site settings -> Build hooks -> add hook (branch: master)"
          echo "2) GitHub -> Settings -> Secrets -> Actions -> NETLIFY_BUILD_HOOK = <hook URL>"
          echo "3) Netlify -> Build & deploy -> disable auto-deploy on push (hook becomes the only trigger)"
